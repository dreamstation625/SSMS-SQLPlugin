name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build VSIX and installer
        run: python src/SsmsSqlPlugin.Vsix/build.py --no-deploy --installer

      - name: Formatter regression
        run: dotnet run --project tools/FormatCli -- --quiet

      - name: Complex SQL corpus
        run: dotnet run --project tools/FormatCli -- --dir tools/FormatCli/Corpus

      - uses: actions/upload-artifact@v4
        with:
          name: SSMS-SQLPlugin
          path: |
            src/SsmsSqlPlugin.Vsix/dist/SSMS-SQLPlugin.vsix
            src/SsmsSqlPlugin.Vsix/dist/SSMS-SQLPlugin-Setup.exe
