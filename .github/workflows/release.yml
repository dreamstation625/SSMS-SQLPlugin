name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build VSIX and installer
        run: python src/SsmsSqlPlugin.Vsix/build.py --no-deploy --installer

      - name: Formatter regression
        run: dotnet run --project tools/FormatCli -- --quiet

      - name: Complex SQL corpus
        run: dotnet run --project tools/FormatCli -- --dir tools/FormatCli/Corpus

      - name: Pack release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item src/SsmsSqlPlugin.Vsix/dist/SSMS-SQLPlugin-Setup.exe release/
          Copy-Item src/SsmsSqlPlugin.Vsix/dist/SSMS-SQLPlugin.vsix release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath "release/SSMS-SQLPlugin-${{ github.ref_name }}.zip" -Force

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SSMS-SQLPlugin-Setup.exe
            release/SSMS-SQLPlugin.vsix
            release/SSMS-SQLPlugin-${{ github.ref_name }}.zip
